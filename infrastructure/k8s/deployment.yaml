apiVersion: apps/v1
kind: Deployment
metadata:
  name: autohub-deployment
  labels:
    app: autohub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autohub
  template:
    metadata:
      labels:
        app: autohub
    spec:
      containers:
      - name: autohub
        # Replace with your actual Docker image from the pipeline
        image: us-central1-docker.pkg.dev/autohub2-496117/autohub-repo/autohub2:v4
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: autohub-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
