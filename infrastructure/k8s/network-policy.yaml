---
# Allow only ingress-nginx and prometheus to reach the app pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autohub-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: autohub
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Accept traffic from NGINX ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  # Accept scrape requests from Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS resolution
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS to external services (Supabase, Gemini API)
  - ports:
    - protocol: TCP
      port: 443
---
# Prevent monitoring namespace from being reached by app pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-isolation
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  # Only allow traffic from within monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # Allow Prometheus scrape from app namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 9090
