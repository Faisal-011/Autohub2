apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: autohub-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: autohub.availability
    interval: 30s
    rules:
    - alert: AutoHubDown
      expr: probe_success{job="probe/monitoring/autohub-blackbox", instance=~"https://35.192.141.65.*", instance!~".*/api/.*"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "AutoHub application is unreachable"
        description: "The AutoHub endpoint {{ $labels.instance }} has been down for more than 2 minutes."

    - alert: AutoHubHealthCheckFailing
      expr: probe_success{job="probe/monitoring/autohub-blackbox", instance=~".*/api/health"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AutoHub health check is failing (database may be down)"
        description: "The /api/health endpoint has been failing for more than 1 minute — Supabase connection may be broken."

  - name: autohub.performance
    rules:
    - alert: HighRequestLatency
      expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "AutoHub p99 latency exceeds 2 seconds"
        description: "The 99th percentile request duration is {{ $value }}s over the last 5 minutes."

    - alert: HighErrorRate
      expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "AutoHub error rate above 5%"
        description: "More than 5% of requests are returning 5xx errors."

  - name: autohub.database
    rules:
    - alert: DatabaseErrorSpike
      expr: rate(db_errors_total[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "AutoHub database errors spiking"
        description: "Database errors are occurring at {{ $value }} errors/second."

    - alert: SlowDatabaseQueries
      expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "AutoHub Supabase queries slow (p95 > 1s)"
        description: "p95 database query duration is {{ $value }}s."

  - name: autohub.pods
    rules:
    - alert: AutoHubPodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{pod=~"autohub-deployment.*"}[15m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "AutoHub pod is crash-looping"
        description: "Pod {{ $labels.pod }} is restarting frequently."

    - alert: AutoHubLowReplicas
      expr: kube_deployment_status_available_replicas{deployment="autohub-deployment"} < 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AutoHub has no available replicas"
        description: "The autohub-deployment has {{ $value }} available replicas."
