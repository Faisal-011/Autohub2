grafana:
  enabled: true
  # Set via: export TF_VAR_grafana_password="<strong-password>"
  # Never commit a real password here.
  adminPassword: "${var.grafana_password}"
  service:
    type: LoadBalancer

prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: 'autohub-nextjs'
        static_configs:
          - targets: ['autohub-service.default.svc.cluster.local:80']
        metrics_path: '/api/metrics'
        scrape_interval: 15s